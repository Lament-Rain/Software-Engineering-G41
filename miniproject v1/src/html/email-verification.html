<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUPT International School TA Recruitment System - Email Verification</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables */
        :root {
            --primary-color: #003366;
            --primary-light: #1a4b80;
            --secondary-color: #7a67ee;
            --accent-color: #ff9f43;
            --success-color: #10b981;
            --error-color: #ef4444;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 51, 102, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 51, 102, 0.12), 0 2px 4px -1px rgba(0, 51, 102, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 51, 102, 0.12), 0 4px 6px -2px rgba(0, 51, 102, 0.05);
            
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            
            --font-sans: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Inter', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
        }
        
        .header-bar {
            height: 8px;
            display: flex;
        }
        
        .header-bar div {
            flex: 1;
        }
        
        .bg-primary {
            background-color: var(--primary-color);
        }
        
        .bg-secondary {
            background-color: var(--secondary-color);
        }
        
        .bg-accent {
            background-color: var(--accent-color);
        }
        
        .bg-success {
            background-color: var(--success-color);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-2xl);
        }
        
        .email-verification-card {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xl);
            max-width: 480px;
            margin: 0 auto;
        }
        
        .card-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: var(--spacing-sm);
        }
        
        .card-subtitle {
            font-size: 16px;
            color: var(--gray-600);
            margin-bottom: var(--spacing-md);
        }
        
        .email-info {
            font-size: 16px;
            font-weight: 500;
            color: var(--gray-800);
            margin-bottom: var(--spacing-xl);
        }
        
        .code-inputs {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .code-field {
            width: 50px;
            height: 50px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm);
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }
        
        .code-field:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }
        
        .resend-container {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .resend-link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .resend-link:hover {
            text-decoration: underline;
        }
        
        .resend-link:disabled {
            color: var(--gray-400);
            cursor: not-allowed;
        }
        
        .resend-timer {
            font-size: 14px;
            color: var(--gray-500);
            margin-left: var(--spacing-xs);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-bottom: var(--spacing-md);
            text-align: center;
            display: none;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: var(--font-sans);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary {
            background-color: var(--white);
            color: var(--gray-700);
            border: 1px solid var(--gray-300);
        }
        
        .btn-secondary:hover {
            background-color: var(--gray-50);
            border-color: var(--gray-400);
        }
        
        .footer {
            text-align: center;
            margin-top: var(--spacing-2xl);
        }
        
        .footer-text {
            font-size: 12px;
            color: var(--gray-500);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-lg);
            }
            
            .email-verification-card {
                padding: var(--spacing-lg);
            }
            
            .code-inputs {
                gap: var(--spacing-sm);
            }
            
            .code-field {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="bg-primary"></div>
        <div class="bg-secondary"></div>
        <div class="bg-accent"></div>
        <div class="bg-success"></div>
    </div>
    
    <div class="container">
        <div class="email-verification-card">
            <div class="card-header">
                <h1 class="card-title">Verify your Email Address</h1>
                <p class="card-subtitle">Enter the verification code sent to</p>
                <p class="email-info">2664265180@qq.com</p>
            </div>
            
            <form id="verificationForm">
                <div class="code-inputs">
                    <input type="text" class="code-field" maxlength="1" data-index="0">
                    <input type="text" class="code-field" maxlength="1" data-index="1">
                    <input type="text" class="code-field" maxlength="1" data-index="2">
                    <input type="text" class="code-field" maxlength="1" data-index="3">
                    <input type="text" class="code-field" maxlength="1" data-index="4">
                    <input type="text" class="code-field" maxlength="1" data-index="5">
                </div>
                
                <div class="resend-container">
                    <span>Didn't receive the code?</span>
                    <a href="#" class="resend-link" id="resendLink">Resend</a>
                    <span class="resend-timer" id="resendTimer">(60s)</span>
                </div>
                
                <div id="errorMessage" class="error-message">Please enter all 6 digits</div>
                
                <div class="button-group">
                    <button type="button" class="btn btn-secondary" id="backButton">Back</button>
                    <button type="submit" class="btn btn-primary" id="verifyButton">Verify & Continue</button>
                </div>
            </form>
        </div>
        
        <div class="footer">
            <p class="footer-text">&copy; 2026 BUPT International School. All rights reserved.</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const verificationForm = document.getElementById('verificationForm');
            const backButton = document.getElementById('backButton');
            const resendLink = document.getElementById('resendLink');
            const resendTimer = document.getElementById('resendTimer');
            const codeFields = document.querySelectorAll('.code-field');
            
            let resendTimeLeft = 60;
            let resendTimerInterval;
            
            // 启动重发计时器
            function startResendTimer() {
                resendLink.style.pointerEvents = 'none';
                resendLink.style.color = 'var(--gray-400)';
                resendTimeLeft = 60;
                
                resendTimerInterval = setInterval(function() {
                    resendTimeLeft--;
                    resendTimer.textContent = `(${resendTimeLeft}s)`;
                    
                    if (resendTimeLeft <= 0) {
                        clearInterval(resendTimerInterval);
                        resendLink.style.pointerEvents = 'auto';
                        resendLink.style.color = 'var(--primary-color)';
                        resendTimer.textContent = '';
                    }
                }, 1000);
            }
            
            // 初始化重发计时器
            startResendTimer();
            
            // 验证码输入框焦点管理
            codeFields.forEach((field, index) => {
                field.addEventListener('input', function() {
                    if (this.value.length === 1) {
                        if (index < codeFields.length - 1) {
                            codeFields[index + 1].focus();
                        } else {
                            this.blur();
                        }
                    }
                });
                
                field.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0) {
                        if (index > 0) {
                            codeFields[index - 1].focus();
                        }
                    }
                });
            });
            
            // 验证码表单提交
            verificationForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                let code = '';
                codeFields.forEach(field => {
                    code += field.value;
                });
                
                if (code.length !== 6) {
                    document.getElementById('errorMessage').style.display = 'block';
                    return;
                }
                
                document.getElementById('errorMessage').style.display = 'none';
                
                // 模拟验证成功后跳转
                setTimeout(function() {
                    window.location.href = 'register.html';
                }, 500);
            });
            
            // 返回按钮
            backButton.addEventListener('click', function() {
                window.location.href = 'email-input.html';
            });
            
            // 重发验证码
            resendLink.addEventListener('click', function(e) {
                e.preventDefault();
                
                if (resendTimeLeft <= 0) {
                    // 模拟发送验证码
                    alert('New verification code sent');
                    startResendTimer();
                }
            });
        });
    </script>
</body>
</html>
