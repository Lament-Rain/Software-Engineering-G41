<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUPT International School TA Recruitment System</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables */
        :root {
            --primary-color: #003366;
            --primary-light: #1a4b80;
            --secondary-color: #7a67ee;
            --accent-color: #ff9f43;
            --success-color: #10b981;
            --error-color: #ef4444;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 51, 102, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 51, 102, 0.12), 0 2px 4px -1px rgba(0, 51, 102, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 51, 102, 0.12), 0 4px 6px -2px rgba(0, 51, 102, 0.05);
            
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            
            --font-sans: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Inter', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-2xl);
        }
        
        .header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }
        
        .logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: var(--spacing-md);
        }
        
        .subtitle {
            font-size: 18px;
            color: var(--gray-600);
            margin-bottom: var(--spacing-xl);
        }
        
        .card {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: var(--spacing-xl);
        }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--spacing-lg);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--gray-800);
        }
        
        .nav-item:hover {
            background-color: var(--gray-50);
            border-color: var(--primary-color);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        
        .nav-icon {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: var(--spacing-sm);
        }
        
        .nav-text {
            font-size: 14px;
            font-weight: 500;
        }
        
        .footer {
            margin-top: var(--spacing-2xl);
            text-align: center;
        }
        
        .footer-text {
            font-size: 12px;
            color: var(--gray-500);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-lg);
            }
            
            .logo {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .nav-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">BUPT TA System</h1>
            <p class="subtitle">BUPT International School TA Recruitment System</p>
        </div>
        
        <div class="card">
            <h2 class="card-title">Navigation</h2>
            
            <div class="nav-grid">
                <a href="login.html" class="nav-item">
                    <i class="fas fa-sign-in-alt nav-icon"></i>
                    <span class="nav-text">Login</span>
                </a>
                
                <a href="register.html" class="nav-item">
                    <i class="fas fa-user-plus nav-icon"></i>
                    <span class="nav-text">Register</span>
                </a>
                
                <a href="ta-dashboard.html" class="nav-item">
                    <i class="fas fa-graduation-cap nav-icon"></i>
                    <span class="nav-text">TA Dashboard</span>
                </a>
                
                <a href="mo-dashboard.html" class="nav-item">
                    <i class="fas fa-chalkboard-teacher nav-icon"></i>
                    <span class="nav-text">MO Dashboard</span>
                </a>
                
                <a href="admin-dashboard.html" class="nav-item">
                    <i class="fas fa-cogs nav-icon"></i>
                    <span class="nav-text">Admin Dashboard</span>
                </a>
            </div>
        </div>
        
        <div class="footer">
            <p class="footer-text">&copy; 2026 BUPT International School. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
